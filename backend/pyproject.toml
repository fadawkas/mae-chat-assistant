[project]
name = "mae"
version = "0.1.0"
description = "Mae — self-hosted AI workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "arq>=0.26.0",
    "alembic>=1.14.0",
    "redis>=5.2.0",
    "croniter>=6.0.0",
    "python-multipart>=0.0.20",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "weasyprint>=63.0",
    "pypdf>=5.1.0",
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]
