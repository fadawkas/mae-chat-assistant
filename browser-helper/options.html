<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mae Browser Helper setup</title>
  <link rel="stylesheet" href="popup.css">
  <script src="options.js" defer></script>
</head>
<body>
  <main>
    <h1>Connect to your Mae workspace</h1>
    <p>This grants the helper permission to contact the Mae address you choose. Sharing tab data still requires your selection and a separate code each run.</p>
    <form>
      <label>Mae address<input id="address" type="url" required autocomplete="off" placeholder="https://mae.example.org"></label>
      <button id="save">Allow this Mae address</button>
      <button id="disconnect" type="button">Disconnect helper</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
