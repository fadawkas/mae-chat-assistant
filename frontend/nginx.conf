server {
    listen 80;
    http2 on;

    # Static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy — no trailing slash, preserves /api prefix
    # Use resolver + variable for dynamic resolution so nginx starts
    # even if mae-api isn't available yet.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream http://mae-api:8000;

    location /api {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (disables buffering that would break streaming)
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
